      properties:
        text: { type: string }
        placeholders:
          type: array
          items: { type: string }
      required: [text, placeholders]
    LibraryRenderError:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
        missing:
          type: array
          items: { type: string }
      required: [error, message]
    ReportSchedule:
      type: object
      required: [id, workspaceId, createdBy, name, frequency, weekday, dayOfMonth, hour, timezone, rangeKey, platform, accountId, recipients, enabled, lastRunAt, lastStatus, lastError, nextRunAt, createdAt]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        createdBy: { type: ["string", "null"] }
        name: { type: string }
        frequency: { type: string, enum: [weekly, monthly] }
        weekday: { type: ["integer", "null"], description: "0 (Sunday) to 6; weekly only" }
        dayOfMonth: { type: ["integer", "null"], description: "1 to 28; monthly only" }
        hour: { type: integer }
        timezone: { type: string }
        rangeKey: { type: string, enum: [7d, 30d, 90d] }
        platform: { type: ["string", "null"] }
        accountId: { type: ["string", "null"] }
        recipients: { type: array, items: { type: string } }
        enabled: { type: boolean }
        lastRunAt: { type: ["string", "null"], format: date-time }
        lastStatus: { type: ["string", "null"], description: "sent or failed" }
        lastError: { type: ["string", "null"] }
        nextRunAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    ReportScheduleList:
      type: object
      required: [schedules]
      properties:
        schedules: { type: array, items: { $ref: "#/components/schemas/ReportSchedule" } }
    ReportScheduleCreateInput:
      type: object
      required: [name, frequency, hour, recipients]
      properties:
        name: { type: string, maxLength: 100 }
        frequency: { type: string, enum: [weekly, monthly] }
        weekday: { type: integer, minimum: 0, maximum: 6, description: "Required when weekly" }
        dayOfMonth: { type: integer, minimum: 1, maximum: 28, description: "Required when monthly" }
        hour: { type: integer, minimum: 0, maximum: 23 }
        timezone: { type: string, description: "IANA zone, default UTC" }
        rangeKey: { type: string, enum: [7d, 30d, 90d] }
        platform: { type: ["string", "null"] }
        accountId: { type: ["string", "null"] }
        recipients: { type: array, maxItems: 10, items: { type: string } }
        enabled: { type: boolean }
    ReportScheduleUpdateInput:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        frequency: { type: string, enum: [weekly, monthly] }
        weekday: { type: integer, minimum: 0, maximum: 6 }
        dayOfMonth: { type: integer, minimum: 1, maximum: 28 }
        hour: { type: integer, minimum: 0, maximum: 23 }
        timezone: { type: string }
        rangeKey: { type: string, enum: [7d, 30d, 90d] }
        platform: { type: ["string", "null"] }
        accountId: { type: ["string", "null"] }
        recipients: { type: array, maxItems: 10, items: { type: string } }
        enabled: { type: boolean }
    ReportRun:
      type: object
      required: [id, scheduleId, ranAt, status, error, recipientCount]
      properties:
        id: { type: string }
        scheduleId: { type: string }
        ranAt: { type: string, format: date-time }
        status: { type: string, enum: [sent, failed] }
        error: { type: ["string", "null"] }
        recipientCount: { type: integer }
    ReportRunList:
      type: object
      required: [runs]
      properties:
        runs: { type: array, items: { $ref: "#/components/schemas/ReportRun" } }
    AutomationKind:
      type: string
      enum: [wordpress, rss]
    AutomationStatus:
      type: string
      enum: [active, paused, error]
      description: "error = stopped after 5 failed checks in a row; resume to try again"
    AutomationMode:
      type: string
      enum: [publish, queue, draft]
      description: "publish = goes out on the publisher's next pass (the approvals gate still applies); queue = next free queue slot, or a draft when there is none; draft = saved as a draft"
    AutomationConfig:
      type: object
      required: [connectedAccountIds, mode, template, includeImage, maxPostsPerRun, postExistingOnFirstRun]
      properties:
        connectedAccountIds: { type: array, items: { type: string } }
        mode: { $ref: "#/components/schemas/AutomationMode" }
        template: { type: string, description: "Post text. Tokens: {title} {url} {excerpt} {author} {site}" }
        includeImage: { type: boolean, description: "Use the item's picture on the link card (and as Instagram's photo)" }
        maxPostsPerRun: { type: integer, minimum: 1, maximum: 10 }
        postExistingOnFirstRun: { type: boolean, description: "Post the single newest existing item on the first run instead of nothing" }
    AutomationConfigInput:
      type: object
      properties:
        connectedAccountIds: { type: array, minItems: 1, items: { type: string }, description: "Required when creating. YouTube channels can't be used." }
        mode: { $ref: "#/components/schemas/AutomationMode" }
        template: { type: string, maxLength: 2000, description: "Must contain {title} or {url}. Default \"{title}\\n\\n{url}\"" }
        includeImage: { type: boolean }
        maxPostsPerRun: { type: integer, minimum: 1, maximum: 10 }
        postExistingOnFirstRun: { type: boolean }
    AutomationAccount:
      type: object
      required: [id, name, platform, avatarUrl, status]
      properties:
        id: { type: string }
        name: { type: string }
        platform: { type: string }
        avatarUrl: { type: ["string", "null"] }
        status: { type: string, description: "The connected account's status; anything but active needs a reconnect" }
    Automation:
      type: object
      required: [id, kind, name, sourceUrl, status, config, lastRunAt, nextRunAt, lastStatus, lastError, consecutiveFailures, postsCreatedTotal, accounts, createdAt, updatedAt]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/AutomationKind" }
        name: { type: string }
        sourceUrl: { type: string }
        status: { $ref: "#/components/schemas/AutomationStatus" }
        config: { $ref: "#/components/schemas/AutomationConfig" }
        lastRunAt: { type: ["string", "null"], format: date-time }
        nextRunAt: { type: ["string", "null"], format: date-time, description: "null unless active" }
        lastStatus: { type: ["string", "null"], description: "success, no_new, partial or failed" }
        lastError: { type: ["string", "null"] }
        consecutiveFailures: { type: integer }
        postsCreatedTotal: { type: integer }
        accounts: { type: array, items: { $ref: "#/components/schemas/AutomationAccount" }, description: "The configured accounts that still exist" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AutomationList:
      type: object
      required: [automations, limit]
      properties:
        automations: { type: array, items: { $ref: "#/components/schemas/Automation" } }
        limit: { type: integer, description: "Most automations a workspace can have" }
    AutomationCreateInput:
      type: object
      required: [kind, name, sourceUrl, config]
      properties:
        kind: { $ref: "#/components/schemas/AutomationKind" }
        name: { type: string, maxLength: 120 }
        sourceUrl: { type: string, maxLength: 2048, description: "wordpress: the site's address (a bare domain is fine); rss: the feed's address. http(s) only." }
        config: { $ref: "#/components/schemas/AutomationConfigInput" }
    AutomationUpdateInput:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        sourceUrl: { type: string, maxLength: 2048 }
        config: { $ref: "#/components/schemas/AutomationConfigInput" }
    AutomationRun:
      type: object
      required: [id, automationId, startedAt, finishedAt, status, itemsFound, itemsNew, postsCreated, error]
      properties:
        id: { type: string }
        automationId: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: ["string", "null"], format: date-time }
        status: { type: string, enum: [success, no_new, partial, failed] }
        itemsFound: { type: integer }
        itemsNew: { type: integer }
        postsCreated: { type: integer }
        error: { type: ["string", "null"] }
    AutomationRunList:
      type: object
      required: [runs]
      properties:
        runs: { type: array, items: { $ref: "#/components/schemas/AutomationRun" } }
    AutomationRunNow:
      type: object
      required: [run, automation]
      properties:
        run: { $ref: "#/components/schemas/AutomationRun" }
        automation: { $ref: "#/components/schemas/Automation" }
    AutomationItem:
      type: object
      required: [id, itemKey, title, url, publishedAt, status, postId, postStatus, postScheduledAt, attempts, error, createdAt]
      properties:
        id: { type: string }
        itemKey: { type: string }
        title: { type: ["string", "null"] }
        url: { type: ["string", "null"] }
        publishedAt: { type: ["string", "null"], format: date-time }
        status: { type: string, enum: [pending, posted, skipped, failed, seen], description: "seen = already in the source when the automation started watching it" }
        postId: { type: ["string", "null"] }
        postStatus: { type: ["string", "null"], description: "The post's current status, when it still exists" }
        postScheduledAt: { type: ["string", "null"], format: date-time }
        attempts: { type: integer }
        error: { type: ["string", "null"], description: "Why the item failed, or a note such as a queue fallback to draft" }
        createdAt: { type: string, format: date-time }
    AutomationItemList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AutomationItem" } }
    AutomationSourceTestInput:
      type: object
      required: [kind, url]
      properties:
        kind: { $ref: "#/components/schemas/AutomationKind" }
        url: { type: string, maxLength: 2048 }
    AutomationSourceItem:
      type: object
      required: [title, url, publishedAt, imageUrl, excerpt]
      properties:
        title: { type: string }
        url: { type: ["string", "null"] }
        publishedAt: { type: ["string", "null"], format: date-time }
        imageUrl: { type: ["string", "null"] }
        excerpt: { type: string }
    AutomationSourceTest:
      type: object
      required: [ok, kind, url, sourceTitle, items]
      properties:
        ok: { type: boolean }
        kind: { $ref: "#/components/schemas/AutomationKind" }
        url: { type: string, description: "The address as it will be saved" }
        sourceTitle: { type: ["string", "null"] }
        items: { type: array, items: { $ref: "#/components/schemas/AutomationSourceItem" } }
    BulkImportMode:
      type: string
      enum: [schedule, queue, draft]
    BulkImportInput:
      type: object
      required: [csv, mode]
      properties:
        csv: { type: string, description: "The file's text, up to 1 MB and 500 rows. Header row required. Columns (case-insensitive): content (required), scheduled_at, accounts, link, first_comment, tags, image_url" }
        fileName: { type: string, maxLength: 200 }
        timezone: { type: string, description: "IANA zone used for scheduled_at values written as YYYY-MM-DD HH:mm. Default UTC" }
        defaultAccountIds: { type: array, items: { type: string }, description: "Used for rows whose accounts column is empty" }
        mode: { $ref: "#/components/schemas/BulkImportMode" }
    BulkImportPreviewRow:
      type: object
      required: [row, content, scheduledAt, accountIds, accountNames, link, firstComment, tags, imageUrl, errors, warnings]
      properties:
        row: { type: integer, description: "Spreadsheet row number (the header is row 1)" }
        content: { type: string }
        scheduledAt: { type: ["string", "null"], format: date-time }
        accountIds: { type: array, items: { type: string } }
        accountNames: { type: array, items: { type: string } }
        link: { type: ["string", "null"] }
        firstComment: { type: ["string", "null"] }
        tags: { type: array, items: { type: string } }
        imageUrl: { type: ["string", "null"] }
        errors: { type: array, items: { type: string }, description: "Any entry means the row will not be imported" }
        warnings: { type: array, items: { type: string } }
    BulkImportPreview:
      type: object
      required: [rows, totalRows, validCount, errorCount, warnings]
      properties:
        rows: { type: array, items: { $ref: "#/components/schemas/BulkImportPreviewRow" } }
        totalRows: { type: integer }
        validCount: { type: integer }
        errorCount: { type: integer }
        warnings: { type: array, items: { type: string }, description: "About the file as a whole, such as ignored columns" }
    BulkImportRowError:
      type: object
      required: [row, message]
      properties:
        row: { type: integer }
        message: { type: string }
    BulkImportResult:
      type: object
      required: [importId, status, totalRows, created, failed, errors, postIds]
      properties:
        importId: { type: string }
        status: { type: string, enum: [completed, partial, failed] }
        totalRows: { type: integer }
        created: { type: integer }
        failed: { type: integer }
        errors: { type: array, items: { $ref: "#/components/schemas/BulkImportRowError" } }
        postIds: { type: array, items: { type: string } }
    BulkImportRecord:
      type: object
      required: [id, fileName, totalRows, createdCount, failedCount, status, mode, errors, createdByUserId, createdAt]
      properties:
        id: { type: string }
        fileName: { type: string }
        totalRows: { type: integer }
        createdCount: { type: integer }
        failedCount: { type: integer }
        status: { type: string, enum: [completed, partial, failed] }
        mode: { type: string }
        errors: { type: array, items: { $ref: "#/components/schemas/BulkImportRowError" } }
        createdByUserId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    BulkImportList:
      type: object
      required: [imports]
      properties:
        imports: { type: array, items: { $ref: "#/components/schemas/BulkImportRecord" } }
