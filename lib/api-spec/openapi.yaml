            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /automations/{id}/runs:
    get:
      operationId: listAutomationRuns
      tags: [automations]
      summary: "Latest 50 runs, newest first (automations:read)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRunList"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /automations/{id}/items:
    get:
      operationId: listAutomationItems
      tags: [automations]
      summary: "Latest 100 source items the automation has recorded, with the post each became (automations:read)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationItemList"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bulk-imports/preview:
    post:
      operationId: previewBulkImport
      tags: [bulk-imports]
      summary: "Validate a CSV of posts without saving anything (posts:write, rate limited). Up to 500 rows and 1 MB."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkImportInput"
      responses:
        "200":
          description: Every row with its errors and warnings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportPreview"
        "400":
          description: The file can't be used at all (no content column, more than 500 rows, unclosed quote, bad options)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The CSV is over 1 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bulk-imports:
    get:
      operationId: listBulkImports
      tags: [bulk-imports]
      summary: "Latest 20 imports, newest first (posts:read)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportList"
    post:
      operationId: createBulkImport
      tags: [bulk-imports]
      summary: "Import a CSV (posts:write, rate limited). The file is validated again on the server; valid rows become posts and the rest are reported per row."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkImportInput"
      responses:
        "201":
          description: The import ran; see created, failed and errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResult"
        "400":
          description: The file can't be used at all
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The CSV is over 1 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    LinkPreview:
      type: object
      properties:
        url: { type: string, description: The final address after redirects. }
        title: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"], description: Absolute http(s) address of the page's preferred image (the first of imageUrls). }
        imageUrls:
          type: array
          description: Every image the page offers for previews, best first, so another can be chosen.
          items: { type: string }
        siteName: { type: ["string", "null"] }
        fetchedAt: { type: string, format: date-time }
      required: [url, title, description, imageUrl, imageUrls, siteName, fetchedAt]
    PostLink:
      type: object
      description: A link attached to a post as a preview card; a snapshot of what the composer showed.
      properties:
        url: { type: string, maxLength: 2048 }
        title: { type: ["string", "null"], maxLength: 300 }
        description: { type: ["string", "null"], maxLength: 1000 }
        imageUrl: { type: ["string", "null"], maxLength: 2048 }
      required: [url]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PostStatus:
      type: string
      enum: [draft, scheduled, publishing, published, failed]
    PostTarget:
      type: object
      properties:
        connectedAccountId:
          type: string
          format: uuid
        platform:
          $ref: "#/components/schemas/Platform"
        accountName:
          type: string
        avatarUrl:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/PostStatus"
        errorMessage:
          type: ["string", "null"]
        postUrl:
          type: ["string", "null"]
          description: Link to the live post on the network, once published.
        firstCommentStatus:
          type: ["string", "null"]
          enum: [published, failed, unsupported, null]
        firstCommentError:
          type: ["string", "null"]
      required: [connectedAccountId, platform, accountName, avatarUrl, status, errorMessage, postUrl, firstCommentStatus, firstCommentError]
    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
        status:
          $ref: "#/components/schemas/PostStatus"
        scheduledAt:
          type: ["string", "null"]
          format: date-time
        publishedAt:
          type: ["string", "null"]
          format: date-time
        targets:
          type: array
          items:
            $ref: "#/components/schemas/PostTarget"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        media:
          type: array
          items:
            $ref: "#/components/schemas/Media"
        platformContent:
          $ref: "#/components/schemas/PlatformContent"
        firstComment:
          type: ["string", "null"]
        link:
          oneOf:
            - $ref: "#/components/schemas/PostLink"
            - type: "null"
        recurrenceId:
          type: ["string", "null"]
          format: uuid
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        customValues:
          type: object
          additionalProperties: { type: string }
          description: Custom field values keyed by field ID.
      required: [id, content, status, scheduledAt, publishedAt, targets, media, platformContent, firstComment, link, recurrenceId, tags, customValues, createdAt, updatedAt]
    Media:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [image, video]
        mimeType:
          type: string
        fileName:
          type: string
        sizeBytes:
          type: integer
        width:
          type: ["integer", "null"]
        height:
          type: ["integer", "null"]
        durationMs:
          type: ["integer", "null"]
        url:
          type: string
          description: Signed-in members of the workspace can GET this to view the file.
      required: [id, kind, mimeType, fileName, sizeBytes, width, height, durationMs, url]
    PostList:
      type: object
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/Post"
      required: [posts]
    CreatePostRequest:
      type: object
      properties:
        content:
          type: string
        connectedAccountIds:
          type: array
          items:
            type: string
            format: uuid
        scheduledAt:
          type: ["string", "null"]
          format: date-time
          description: When set, the post is scheduled for this time; otherwise it is saved as a draft.
        mediaIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
          description: Uploaded media to attach, in display order.
        platformContent:
          $ref: "#/components/schemas/PlatformContent"
        firstComment:
          type: ["string", "null"]
          maxLength: 2000
        link:
          oneOf:
            - $ref: "#/components/schemas/PostLink"
            - type: "null"
          description: A link to show as a preview card on Facebook and LinkedIn. null removes it; omit to leave it unchanged.
        tagIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        customValues:
          type: object
          additionalProperties: { type: string }
        queue:
          type: boolean
          description: Schedule into the next free slot of the selected accounts' posting queues.
      required: [content, connectedAccountIds]
    UpdatePostRequest:
      type: object
      properties:
        content:
          type: string
        connectedAccountIds:
          type: array
          items:
            type: string
            format: uuid
        scheduledAt:
          type: ["string", "null"]
          format: date-time
          description: A time schedules the post; null moves it back to a draft.
        mediaIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
          description: Replaces the attached media, in display order. Omit to leave media unchanged.
        platformContent:
          $ref: "#/components/schemas/PlatformContent"
        firstComment:
          type: ["string", "null"]
          maxLength: 2000
        link:
          oneOf:
            - $ref: "#/components/schemas/PostLink"
            - type: "null"
          description: A link to show as a preview card on Facebook and LinkedIn. null removes it; omit to leave it unchanged.
        tagIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        customValues:
          type: object
          additionalProperties: { type: string }
        queue:
          type: boolean
          description: Schedule into the next free slot of the selected accounts' posting queues.
    AuthUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: ["string", "null"]
      required: [id, email, displayName]
    AuthWorkspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required: [id, name]
    SignupRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 256
        displayName:
          type: string
      required: [email, password]
    SignupResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        workspace:
          $ref: "#/components/schemas/AuthWorkspace"
      required: [user, workspace]
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]
    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
      required: [user]
    MeResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        workspaceId:
          type: string
          format: uuid
        workspace:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
          required: [id, name]
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        permissions:
          type: array
          items: { type: string }
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceSummary"
      required: [user, workspaceId, workspace, role, permissions, workspaces]
    Platform:
      type: string
      enum: [facebook, instagram, linkedin, youtube]
    ConnectionStatus:
      type: string
      enum: [active, expired, revoked, missing_permissions, error]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error, message]
    ConnectionProvider:
      type: object
      properties:
        platform:
          $ref: "#/components/schemas/Platform"
        name:
          type: string
        implemented:
          type: boolean
        configured:
          type: boolean
        missingConfiguration:
          type: array
          items: { type: string }
        requiredScopes:
          type: array
          items: { type: string }
        optionalScopes:
          type: array
          items: { type: string }
        callbackUrl:
          type: ["string", "null"]
      required: [platform, name, implemented, configured, missingConfiguration, requiredScopes, optionalScopes, callbackUrl]
    ConnectionProviderList:
      type: object
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ConnectionProvider"
      required: [providers]
    ConnectedAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        platform:
          $ref: "#/components/schemas/Platform"
        accountType:
          type: string
        externalAccountId:
          type: string
        displayName:
          type: string
        username:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/ConnectionStatus"
        statusDetail:
          type: ["string", "null"]
        scopes:
          type: array
          items: { type: string }
        missingScopes:
          type: array
          items: { type: string }
        firstComment:
          type: string
          enum: [supported, needs_permission, unsupported]
          description: Whether a first comment can be posted with this account.
        tokenExpiresAt:
          type: ["string", "null"]
          format: date-time
        lastVerifiedAt:
          type: ["string", "null"]
          format: date-time
        connectedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, platform, accountType, externalAccountId, displayName, username, avatarUrl, status, statusDetail, scopes, missingScopes, firstComment, tokenExpiresAt, lastVerifiedAt, connectedAt, updatedAt]
    ConnectedAccountList:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/ConnectedAccount"
      required: [accounts]
    PendingCandidate:
      type: object
      properties:
        externalAccountId:
          type: string
        accountType:
          type: string
        displayName:
          type: string
        username:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        selectable:
          type: boolean
        warnings:
          type: array
          items: { type: string }
        alreadyConnected:
          type: boolean
      required: [externalAccountId, accountType, displayName, username, avatarUrl, selectable, warnings, alreadyConnected]
    PendingConnection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        platform:
          $ref: "#/components/schemas/Platform"
        expiresAt:
          type: string
          format: date-time
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/PendingCandidate"
      required: [id, platform, expiresAt, candidates]
    PendingSelection:
      type: object
      properties:
        externalAccountIds:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, minLength: 1 }
      required: [externalAccountIds]
    PlatformContent:
      type: object
      description: Per-network text overrides; a missing key means the base content is used.
      properties:
        facebook: { type: string }
        instagram: { type: string }
        linkedin: { type: string }
        youtube: { type: string }
    Tag:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
        postCount: { type: integer }
      required: [id, name, color]
    TagList:
      type: object
      properties:
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
      required: [tags]
    TagInput:
      type: object
      properties:
        name: { type: string, maxLength: 60 }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
    CustomField:
      type: object
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        label: { type: string }
        type:
          type: string
          enum: [text, number, date, select, url]
        options:
          type: array
          items: { type: string }
        required: { type: boolean }
        position: { type: integer }
      required: [id, key, label, type, options, required, position]
    CustomFieldList:
      type: object
      properties:
        fields:
          type: array
          items:
            $ref: "#/components/schemas/CustomField"
      required: [fields]
    CustomFieldInput:
      type: object
      properties:
        label: { type: string, maxLength: 80 }
        type:
          type: string
          enum: [text, number, date, select, url]
        options:
          type: array
          items: { type: string }
        required: { type: boolean }
        position: { type: integer }
    MentionGroup:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        handles:
          type: array
          items: { type: string }
      required: [id, name, handles]
    MentionGroupList:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/MentionGroup"
      required: [groups]
    MentionGroupInput:
      type: object
      properties:
        name: { type: string, maxLength: 60 }
        handles:
          type: array
          items: { type: string }
    QueueSlot:
      type: object
      properties:
        id: { type: string, format: uuid }
        weekday: { type: integer, minimum: 0, maximum: 6 }
        time: { type: string, description: "HH:MM in the queue's time zone" }
      required: [id, weekday, time]
    Queue:
      type: object
      properties:
        connectedAccountId: { type: string, format: uuid }
        timezone: { type: string }
        paused: { type: boolean }
        slots:
          type: array
          items:
            $ref: "#/components/schemas/QueueSlot"
        nextSlots:
          type: array
          items: { type: string, format: date-time }
      required: [connectedAccountId, timezone, paused, slots]
    QueueList:
      type: object
      properties:
        queues:
          type: array
          items:
            $ref: "#/components/schemas/Queue"
      required: [queues]
    QueueInput:
      type: object
      properties:
        timezone: { type: string }
        paused: { type: boolean }
        slots:
          type: array
          maxItems: 70
          items:
            type: object
            properties:
              weekday: { type: integer, minimum: 0, maximum: 6 }
              time: { type: string }
            required: [weekday, time]
      required: [timezone, slots]
    Recurrence:
      type: object
      properties:
        id: { type: string, format: uuid }
        frequency:
          type: string
          enum: [daily, weekly, monthly]
        interval: { type: integer }
        weekdays:
          type: array
          items: { type: integer }
        dayOfMonth: { type: ["integer", "null"] }
        time: { type: string }
        timezone: { type: string }
        startDate: { type: string }
        endDate: { type: ["string", "null"] }
        maxOccurrences: { type: ["integer", "null"] }
        occurrencesCreated: { type: integer }
        nextRunAt: { type: ["string", "null"], format: date-time }
        paused: { type: boolean }
        finished: { type: boolean }
        content: { type: string }
        firstComment: { type: ["string", "null"] }
        platformContent:
          $ref: "#/components/schemas/PlatformContent"
        connectedAccountIds:
          type: array
          items: { type: string, format: uuid }
        mediaIds:
          type: array
          items: { type: string, format: uuid }
        tagIds:
          type: array
          items: { type: string, format: uuid }
        upcoming:
          type: array
          items: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, frequency, interval, weekdays, dayOfMonth, time, timezone, startDate, endDate, maxOccurrences, occurrencesCreated, nextRunAt, paused, finished, content, firstComment, platformContent, connectedAccountIds, mediaIds, tagIds, upcoming, createdAt, updatedAt]
    RecurrenceDetail:
      allOf:
        - $ref: "#/components/schemas/Recurrence"
        - type: object
          properties:
            posts:
              type: array
              items:
                $ref: "#/components/schemas/Post"
          required: [posts]
    RecurrenceList:
      type: object
      properties:
        recurrences:
          type: array
          items:
            $ref: "#/components/schemas/Recurrence"
      required: [recurrences]
    RecurrenceInput:
      type: object
      properties:
        frequency:
          type: string
          enum: [daily, weekly, monthly]
        interval: { type: integer, minimum: 1, maximum: 52 }
        weekdays:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
        dayOfMonth: { type: ["integer", "null"], minimum: 1, maximum: 31 }
        time: { type: string }
        timezone: { type: string }
        startDate: { type: string }
        endDate: { type: ["string", "null"] }
        maxOccurrences: { type: ["integer", "null"] }
        paused: { type: boolean }
        content: { type: string }
        firstComment: { type: ["string", "null"] }
        platformContent:
          $ref: "#/components/schemas/PlatformContent"
        connectedAccountIds:
          type: array
          items: { type: string, format: uuid }
        mediaIds:
          type: array
          items: { type: string, format: uuid }
        tagIds:
          type: array
          items: { type: string, format: uuid }
    ReorderQueueRequest:
      type: object
      properties:
        postIds:
          type: array
          items: { type: string, format: uuid }
      required: [postIds]
    WorkspaceRole:
      type: string
      enum: [owner, admin, editor, approver, viewer]
    WorkspaceSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        current: { type: boolean }
      required: [id, name, role, current]
    WorkspaceList:
      type: object
      properties:
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceSummary"
      required: [workspaces]
    Member:
      type: object
      properties:
        userId: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: ["string", "null"] }
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        joinedAt: { type: string, format: date-time }
      required: [userId, email, displayName, role, joinedAt]
    MemberList:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"
      required: [members]
    PendingInvitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string }
        invitedBy: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        expired: { type: boolean }
      required: [id, email, role, invitedBy, createdAt, expiresAt, expired]
    RoleInfo:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        label: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { type: string }
      required: [role, label, description, permissions]
    ActivityEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        target: { type: ["string", "null"] }
        actor: { type: string }
        detail:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
      required: [id, action, target, actor, detail, createdAt]
    Team:
      type: object
      properties:
        workspace:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
          required: [id, name]
        me:
          type: object
          properties:
            userId: { type: string, format: uuid }
            role:
              $ref: "#/components/schemas/WorkspaceRole"
            canManage: { type: boolean }
            grantableRoles:
              type: array
              items:
                $ref: "#/components/schemas/WorkspaceRole"
          required: [userId, role, canManage, grantableRoles]
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/PendingInvitation"
        roles:
