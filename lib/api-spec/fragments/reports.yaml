paths:
  /analytics/report.pdf:
    get:
      operationId: getAnalyticsReportPdf
      tags: [reports]
      summary: Analytics report as a PDF (same data as GET /analytics)
      parameters:
        - { name: range, in: query, required: false, schema: { type: string, enum: [today, 7d, 30d, 90d, custom] } }
        - { name: from, in: query, required: false, schema: { type: string } }
        - { name: to, in: query, required: false, schema: { type: string } }
        - { name: tz, in: query, required: false, schema: { type: string } }
        - { name: platform, in: query, required: false, schema: { type: string } }
        - { name: accountId, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: PDF attachment named socialflow-analytics-FROM_to_TO.pdf
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/schedules:
    get:
      operationId: listReportSchedules
      tags: [reports]
      summary: Scheduled email reports (reports:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportScheduleList"
    post:
      operationId: createReportSchedule
      tags: [reports]
      summary: Create a scheduled report (reports:manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportScheduleBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSchedule"
        "400":
          description: Invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/schedules/{id}:
    patch:
      operationId: updateReportSchedule
      tags: [reports]
      summary: Change a scheduled report (reports:manage)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportScheduleBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSchedule"
        "400":
          description: Invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteReportSchedule
      tags: [reports]
      summary: Delete a scheduled report (reports:manage)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/schedules/{id}/send-now:
    post:
      operationId: sendReportScheduleNow
      tags: [reports]
      summary: Send the report now (reports:manage, rate limited); the run shows success or the failure reason
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The run that was recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportRun"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/schedules/{id}/runs:
    get:
      operationId: listReportScheduleRuns
      tags: [reports]
      summary: Latest 50 runs of a schedule (reports:read)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportRunList"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
schemas:
  ReportSchedule:
    type: object
    required: [id, workspaceId, createdBy, name, frequency, weekday, dayOfMonth, hour, timezone, rangeKey, platform, accountId, recipients, enabled, lastRunAt, lastStatus, lastError, nextRunAt, createdAt]
    properties:
      id: { type: string }
      workspaceId: { type: string }
      createdBy: { type: ["string", "null"] }
      name: { type: string }
      frequency: { type: string, enum: [weekly, monthly] }
      weekday: { type: ["integer", "null"], description: "0 (Sunday) to 6; weekly only" }
      dayOfMonth: { type: ["integer", "null"], description: "1 to 28; monthly only" }
      hour: { type: integer }
      timezone: { type: string }
      rangeKey: { type: string, enum: [7d, 30d, 90d] }
      platform: { type: ["string", "null"] }
      accountId: { type: ["string", "null"] }
      recipients: { type: array, items: { type: string } }
      enabled: { type: boolean }
      lastRunAt: { type: ["string", "null"], format: date-time }
      lastStatus: { type: ["string", "null"], description: "sent or failed" }
      lastError: { type: ["string", "null"] }
      nextRunAt: { type: ["string", "null"], format: date-time }
      createdAt: { type: string, format: date-time }
  ReportScheduleList:
    type: object
    required: [schedules]
    properties:
      schedules: { type: array, items: { $ref: "#/components/schemas/ReportSchedule" } }
  CreateReportScheduleBody:
    type: object
    required: [name, frequency, hour, recipients]
    properties:
      name: { type: string, maxLength: 100 }
      frequency: { type: string, enum: [weekly, monthly] }
      weekday: { type: integer, minimum: 0, maximum: 6, description: "Required when weekly" }
      dayOfMonth: { type: integer, minimum: 1, maximum: 28, description: "Required when monthly" }
      hour: { type: integer, minimum: 0, maximum: 23 }
      timezone: { type: string, description: "IANA zone, default UTC" }
      rangeKey: { type: string, enum: [7d, 30d, 90d] }
      platform: { type: ["string", "null"] }
      accountId: { type: ["string", "null"] }
      recipients: { type: array, maxItems: 10, items: { type: string } }
      enabled: { type: boolean }
  UpdateReportScheduleBody:
    type: object
    properties:
      name: { type: string, maxLength: 100 }
      frequency: { type: string, enum: [weekly, monthly] }
      weekday: { type: integer, minimum: 0, maximum: 6 }
      dayOfMonth: { type: integer, minimum: 1, maximum: 28 }
      hour: { type: integer, minimum: 0, maximum: 23 }
      timezone: { type: string }
      rangeKey: { type: string, enum: [7d, 30d, 90d] }
      platform: { type: ["string", "null"] }
      accountId: { type: ["string", "null"] }
      recipients: { type: array, maxItems: 10, items: { type: string } }
      enabled: { type: boolean }
  ReportRun:
    type: object
    required: [id, scheduleId, ranAt, status, error, recipientCount]
    properties:
      id: { type: string }
      scheduleId: { type: string }
      ranAt: { type: string, format: date-time }
      status: { type: string, enum: [sent, failed] }
      error: { type: ["string", "null"] }
      recipientCount: { type: integer }
  ReportRunList:
    type: object
    required: [runs]
    properties:
      runs: { type: array, items: { $ref: "#/components/schemas/ReportRun" } }
